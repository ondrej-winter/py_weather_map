[project]
name = "weather-map"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
weather-map = "weather_map:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_map"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".clinerules",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "COM812",
    "D1",
    "FIX",
    "ISC001",
    "TD",
]

[tool.ruff.lint.per-file-ignores]
"src/weather_map/__init__.py" = ["T201"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
