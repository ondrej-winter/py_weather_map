[project]
name = "weather-map"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[project.scripts]
weather-map = "weather_map:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_map"]

[tool.hatch.build.targets.wheel.force-include]
"src/weather_map/adapters/input/http/static" = "weather_map/adapters/input/http/static"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".clinerules",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "ARG001",
    "ARG002",
    "B008",
    "COM812",
    "D1",
    "FAST002",
    "FIX",
    "ISC001",
    "PLR0913",
    "PLR2004",
    "RET504",
    "TC001",
    "TC002",
    "TC003",
    "TC004",
    "TD",
    "UP017",
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
"src/weather_map/__init__.py" = ["T201"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "live_external: tests that call real external services and are disabled by default",
]
